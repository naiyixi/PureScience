name: Windows Full Test

# Preserve complete real-Windows coverage after merge without adding its runtime to ordinary PRs or
# blocking a stable release.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# A newer main push supersedes stale advisory coverage.
concurrency:
  group: windows-full-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_full_test:
    name: Windows full test (${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      # Turns on module-aware sharding (scripts/ci/windows-test-sequencer.ts): one module family per
      # shard instead of Vitest's file-count split. Hosted Windows runners are disk-bound, so a shard
      # that mixes SQLite-heavy suites with kernel or packaging suites spends its time waiting on I/O
      # while another shard idles. The sequencer refuses to run on any shard count other than 8.
      VITEST_WINDOWS_FULL_TEST: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the Electron binary is provisioned
        # Hosted runners intermittently finish `npm ci` without the Electron binary — the postinstall download
        # fails while the install still reports success — and the first suite that imports it then fails at
        # collection (`Error: Electron failed to install correctly`), which looks like a shard failure and
        # moves from shard to shard between runs. Provisioning is not what these shards measure, so check it
        # here and retry once instead of letting it land on an arbitrary suite.
        shell: bash
        run: |
          if [ -f node_modules/electron/path.txt ]; then
            echo "electron binary: $(cat node_modules/electron/path.txt)"
            exit 0
          fi
          echo "::warning::Electron binary missing after npm ci — retrying the postinstall"
          node node_modules/electron/install.js
          test -f node_modules/electron/path.txt

      - name: Test complete suite shard
        # Files stay serial on Windows, and the 120-second budgets are kept deliberately: with module
        # sharding the contention that made them necessary is mostly gone, but lowering a timeout in
        # the same change would confound two variables — if a suite still needs the ceiling, that is a
        # finding to chase, not a number to tune down.
        run: npm test -- --shard=${{ matrix.shard }}/8 --maxWorkers=1 --testTimeout=120000 --hookTimeout=120000 --reporter=default --reporter=github-actions
