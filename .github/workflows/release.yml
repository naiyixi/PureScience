name: Release

# Stable release: on a version tag (e.g. v0.1.0) build every platform and publish them to a single
# GitHub Release. Also runnable manually from the Actions tab (builds + uploads artifacts; only a
# tag run creates the Release). Nightly builds live in nightly.yml.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      # Manual publish: run the full matrix, then upload every installer to this existing tag's
      # Release (e.g. v0.11.1). Leave empty for build-and-upload-artifacts only.
      release_tag:
        description: 'Tag to publish assets to (e.g. v0.11.1); empty = artifacts only'
        required: false
        default: ''
      previous_version:
        description: 'Stable tag the update drill starts from (e.g. v1.74.0); empty = newest stable'
        required: false
        default: ''

# Required to create a Release and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate desktop release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match $expected_tag." >&2
            exit 1
          fi

      - name: Verify release commit is on main
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # Build the platform matrix (macOS arm64/x64 + Linux + Windows x64) via the reusable workflow.
  # secrets: inherit forwards the optional signing/notarization secrets. macOS is signed but NOT
  # notarized here — notarization is decoupled into the notarize-mac job below.
  build:
    needs: release-preflight
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Notarize + staple the signed macOS artifacts on their own runner, then re-emit the stapled dmg/zip
  # (overwriting the build's signed-only ones) so publish always attaches a stapled mac build. Kept out
  # of the build matrix so a slow Apple notarization never holds up the platform builds; the job is
  # time-capped and re-runnable (see notarize-mac.yml). When the Apple credentials are absent it skips
  # *by name* and the certification record carries `macSignature: unsigned` — a skipped notarization
  # must never read as a notarized mac build (issue #19).
  notarize-mac:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/notarize-mac.yml
    secrets: inherit

  # The reusable build already hard-gates a fresh NSIS install/start/uninstall. On stable tags, also
  # install the latest published stable version, prove electron-updater uses a differential Range
  # download, upgrade over a live process, roll back, and restart current. Runs beside notarization.
  windows-upgrade-smoke:
    # Also after publish: the drill upgrades to *this* release's version, so the Release has to exist
    # before it starts (the built installers come from the build job, the previous stable from an earlier
    # Release, so both are needed). This removes a race, not a failure: the drill's own timeout against the
    # updated version is older than this change and failed the same way on the previous release, which the
    # workflow already documents as timing-sensitive on hosted runners.
    needs: [build, publish]
    # Tag pushes certify the published update path, so this drill still waits for publish. A manual dispatch
    # with an empty `release_tag` (artifacts only) is how the drill gets exercised on demand: it needs only the
    # current artifacts plus the last published stable, and it builds its own local update feed. Being runnable
    # only *after* a successful release is how this drill stayed red for five releases without anyone noticing.
    if: >-
      always() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'success'))
    runs-on: windows-latest
    # Windows packages are intentionally unsigned until a certificate is provisioned. This historical
    # upgrade drill is timing-sensitive on hosted runners, so keep its failure visible without blocking
    # the independently certified packages and macOS notarization from being published.
    continue-on-error: true
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download current Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x64
          path: current

      - name: Download previous stable Windows installer
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.ref_name }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          New-Item -ItemType Directory -Force previous | Out-Null
          $tag = $env:PREVIOUS_VERSION
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $releases = gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $tag = ($releases | ConvertFrom-Json | Where-Object { $_.tagName -like 'v*' -and $_.tagName -ne $env:CURRENT_TAG } | Select-Object -First 1).tagName
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            "available=false" >> $env:GITHUB_OUTPUT
            "reason=no-previous-stable-release" >> $env:GITHUB_OUTPUT
            Write-Host "No previous stable release is available; fresh-install smoke already passed."
            exit 0
          }
          gh release download $tag --pattern '*-win-x64-setup.exe' --pattern '*-win-x64-setup.exe.blockmap' --dir previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "available=true" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Certify Windows electron-updater differential update
        id: updater
        if: steps.previous.outputs.available == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/windows-updater-certification.mjs `
            --current-dir current `
            --previous-dir previous `
            --output windows-updater-observation.json 2>&1 |
            Tee-Object -FilePath windows-updater-certification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Drill Windows silent upgrade, process lock, rollback, and restart
        id: installer
        if: always() && steps.previous.outputs.available == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/windows-installer-smoke.mjs `
            --installer-dir current `
            --previous-installer-dir previous 2>&1 |
            Tee-Object -FilePath windows-installer-certification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record Windows update-drill evidence
        if: always()
        shell: pwsh
        run: |
          $available = '${{ steps.previous.outputs.available }}' -eq 'true'
          $passed = '${{ steps.updater.outcome }}' -eq 'success' -and '${{ steps.installer.outcome }}' -eq 'success'
          $status = if (-not $available) { 'not-applicable' } elseif ($passed) { 'passed' } else { 'failed' }
          $arguments = @(
            'scripts/ci/release-certification-evidence.mjs', 'write-windows-update',
            '--output', 'certification-windows-update.json',
            '--current-tag', '${{ github.ref_name }}',
            '--status', $status
          )
          if ($available) {
            $arguments += @('--previous-tag', '${{ steps.previous.outputs.tag }}')
            if (Test-Path 'windows-updater-observation.json') {
              $arguments += @('--updater-observation', 'windows-updater-observation.json')
            }
            if (-not $passed) {
              $arguments += @('--reason', 'updater=${{ steps.updater.outcome }},installer=${{ steps.installer.outcome }}')
            }
          } else {
            $arguments += @('--reason', '${{ steps.previous.outputs.reason }}')
          }
          & node @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows update-drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-update-certification
          retention-days: 1
          path: |
            certification-windows-update.json
            windows-*-certification.log
          if-no-files-found: error

      - name: Report Windows update-drill outcome
        if: >-
          always() && steps.previous.outputs.available == 'true' &&
          (steps.updater.outcome != 'success' || steps.installer.outcome != 'success')
        run: exit 1

  # Collect every platform's artifacts and publish them to the tag's Release in one shot (a single
  # publish job avoids the race of multiple build jobs writing the same Release). Depends on
  # notarize-mac so the mac dmg/zip it downloads are the stapled versions.
  publish:
    # Ordering, not convenience: with `needs: [build]` alone, publish starts the moment the builds
    # finish and can attach the signed-but-unstapled mac dmg/zip — an installed app then downloads a
    # mac build Gatekeeper rejects. Waiting on notarize-mac is what makes the stapled re-emit win.
    #
    # The trade-off is taken on failure mode, not on strictness. notarize-mac reports `skipped` when
    # the publishing run is a dispatch to an existing tag (it is gated on the tag ref, so there is no
    # signed mac artifact to staple): that is a no-op, and treating it as fatal would make manual
    # publishing impossible — hence `skipped` does not block. A real `failure` (Apple rejection, or
    # the job's 30-minute cap expiring) DOES block, so a broken notarization can never publish mac
    # assets. `always()` is required for the job to be evaluated at all once a dependency is skipped;
    # `needs.build.result == 'success'` keeps a failed/cancelled build from publishing anything.
    # notarize-mac's own `from_run` input is untouched — release.yml still calls it via workflow_call
    # with the default from_run: true, so the standalone repair path (from_run: false) is unaffected.
    #
    # The event gate below is the pre-existing condition, kept verbatim (tag push, or a dispatch that
    # named a release_tag); windows-upgrade-smoke reads `needs.publish.result`, which is unchanged.
    needs: [build, notarize-mac]
    if: >-
      always() && (needs.build.result == 'success') &&
      (needs.notarize-mac.result == 'success' || needs.notarize-mac.result == 'skipped') &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    # Job-level permissions fully override the workflow-level block, so contents:write is restated
    # alongside the two scopes the SLSA attestation needs: id-token to sign via Sigstore OIDC, and
    # attestations to write the provenance record.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checkout first (before downloading artifacts): the mac-feed merge step runs a repo script, and
      # actions/checkout cleans the working dir, which would wipe a pre-downloaded artifacts/.
      - name: Checkout (for the mac-feed merge script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true # flatten every platform's files into one directory

      # Fail closed unless every native target reports P0 Electron, visual, and package evidence for
      # this exact tag commit. The historical Windows update drill runs independently as diagnostics.
      - name: Aggregate release certification evidence
        run: >-
          node scripts/ci/release-certification-evidence.mjs aggregate
          --directory artifacts
          --output artifacts/RELEASE-CERTIFICATION.json
          --expected-sha "$GITHUB_SHA"

      # Build the single mac feed the installed app polls (default `latest` channel), from the actual
      # bytes of this release's two mac zips: sha512 + size are recomputed per arch, so the feed can
      # never describe bytes other than the ones attached below, and it does not matter whether the
      # (optional, secret-gated) notarize-mac job ran. Fails the job — before anything is uploaded —
      # unless BOTH arms resolve; a feed naming one arch is the #18 failure, not a warning.
      - name: Merge mac update feed
        run: node scripts/merge-mac-feed.mjs artifacts

      # Release gate (#18): the published mac feed must list BOTH architectures, each with a sha512
      # and a size. Re-reads the file that is about to be uploaded rather than trusting the step
      # above, and is judged on its own exit code (no pipeline), so a regression in the merge path
      # can only ever publish a feed that passes this. Must not become continue-on-error: an
      # installed Apple Silicon app polls this file and would otherwise update to the x64 build.
      - name: Gate the mac update feed on both architectures
        run: node scripts/merge-mac-feed.mjs artifacts --verify

      # One SHA256SUMS.txt covering all installers so users can verify downloads.
      - name: Generate checksums
        working-directory: artifacts
        run: |
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          if [ ${#files[@]} -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          fi

      # The client manifest the in-app UpdateService polls (releases/latest/download/version.json).
      # Without it every manifest-flow client (mac local/nightly/unsigned + fallback) sees
      # "Manifest fetch failed: 404" on check-for-updates; stable in-place clients use the
      # electron-updater feeds uploaded below instead.
      #
      # The version is the tag the Release is created under, NOT the ref that was built: a manual
      # dispatch builds `main`, so the script's GITHUB_REF_NAME fallback named the manifest `main`,
      # matched no installer, and failed the job with "no installers for version main found in
      # artifacts" (v1.76.1). RELEASE_TAG is the same expression as the `tag_name` below, so the
      # manifest cannot describe a version other than the one it is published under.
      - name: Generate version.json client manifest
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/generate-version-manifest.mjs artifacts "$RELEASE_TAG" --github

      # Sign a SLSA build-provenance attestation for the exact installer bytes about to be published,
      # so users can prove each download was built by this workflow from this commit (verify with
      # `gh attestation verify <file> --repo <owner>/<repo>`). SHA256SUMS.txt is excluded — it's a
      # digest list, not a build product. The attestation lives in the repo's Attestations, not as a
      # Release asset, so it doesn't clutter the download list.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb

      # Attach user-facing artifacts + checksums: installers (dmg/exe/AppImage/deb) and the mac
      # portable zips, plus the electron-updater feed files so the manually dispatched website mirror
      # can republish them to the CDN feed: win/linux latest.yml + latest-linux.yml, and the mac feeds.
      # `*-mac.yml` covers the merged latest-mac.yml (the file the app polls) plus the per-arch
      # arm64/x64-mac.yml intermediates it was built from. Blockmaps are win/linux only (mac does
      # full-zip updates in v1).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: PureScience ${{ inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
            artifacts/RELEASE-CERTIFICATION.json
            artifacts/version.json
            artifacts/latest.yml
            artifacts/latest-linux.yml
            artifacts/*-mac.yml
            artifacts/*.blockmap

      # The release page is where the "was the mac build notarized?" question is actually answered, and
      # the generated notes say nothing about it — a green notarize job is not evidence of a signed mac
      # asset (issue #19). The state is read from the certification record this job just wrote and
      # re-checked above, so the page cannot disagree with the bytes; the line is added, replaced, or
      # dropped idempotently, and scripts/release-notes.mjs preserves it on a later body rewrite. This
      # step is not continue-on-error: publishing a mac release without stating its signing state is the
      # failure this issue is about. (Runs only for tagged/manual publishing runs, as does this job.)
      # The release page is the public record of what a version claims, so its body has to be the version's
      # OWN notes: the maturity block plus that version's CHANGELOG section, both composed by
      # scripts/release-notes.mjs out of the tag's own sources. Until this step existed the page kept
      # GitHub's auto-generated commit list, i.e. a stub on a page that answers "what does this version
      # actually do?" (v1.76.1 shipped 428 characters, v1.78.0 the same). The length gate below is the
      # point of the step: a stub can no longer be published silently, and a silently shorter body is the
      # same failure as a silently wrong one.
      - name: Write the version's own notes onto the release page
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NOTES=/tmp/release-notes.md
          node scripts/release-notes.mjs "$VERSION" --print \
            --certification artifacts/RELEASE-CERTIFICATION.json > "$NOTES"
          # The generator warns on stdout; the notes file must start at its first heading.
          sed -i.bak '/^release-notes:/d' "$NOTES"
          gh release edit "$RELEASE_TAG" --notes-file "$NOTES"
          LENGTH=$(gh release view "$RELEASE_TAG" --json body --jq '.body | length')
          echo "release body length: $LENGTH"
          if [ "$LENGTH" -lt 2000 ]; then
            echo "::error::release body is $LENGTH characters — that is the stub, not the version's notes"
            exit 1
          fi

      - name: Disclose the macOS signing state on the release page
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: >-
          node scripts/ci/mac-signing-status.mjs disclose
          --record artifacts/RELEASE-CERTIFICATION.json
          --tag "$RELEASE_TAG"
