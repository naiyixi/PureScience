name: Signing preflight

# Answers one question without guessing: "are the macOS signing inputs actually in place, and do they look
# like what the build expects?" Run it after adding the secrets. It prints presence and shape only — never a
# secret value, never a fragment of one — so the output is safe to paste into an issue.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check signing inputs
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check each input's presence and shape
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_TEAM_ID: ${{ vars.PURESCIENCE_MAC_TEAM_ID }}
        run: |
          set -u
          problems=0
          say() { printf '%-28s %-8s %s\n' "$1" "$2" "$3"; }
          fail() { say "$1" "FAIL" "$2"; problems=$((problems + 1)); }
          ok() { say "$1" "ok" "$2"; }

          printf '%-28s %-8s %s\n' "input" "state" "detail"
          printf '%-28s %-8s %s\n' "----------------------------" "--------" "------"

          # Certificate: base64 of a PKCS#12. A decoded PKCS#12 starts with a DER SEQUENCE (0x30 0x82) and is
          # at least a kilobyte; anything smaller means the wrong file was pasted (a .cer or a .key).
          if [ -z "${MAC_CSC_LINK:-}" ]; then
            fail "MAC_CSC_LINK" "not set — no certificate, the mac assets stay ad-hoc signed"
          else
            tmp="$(mktemp)"
            if printf '%s' "$MAC_CSC_LINK" | base64 --decode > "$tmp" 2>/dev/null; then
              size=$(wc -c < "$tmp" | tr -d ' ')
              magic=$(od -An -tx1 -N2 "$tmp" | tr -d ' \n')
              if [ "$magic" = "3082" ] && [ "$size" -gt 1000 ]; then
                ok "MAC_CSC_LINK" "base64 PKCS#12, ${size} bytes"
              else
                fail "MAC_CSC_LINK" "decodes, but not a PKCS#12 (magic=${magic:-?}, ${size} bytes) — export the certificate as .p12"
              fi
            else
              fail "MAC_CSC_LINK" "not valid base64 — paste the output of: base64 -i cert.p12 | pbcopy"
            fi
            rm -f "$tmp"
          fi

          if [ -z "${MAC_CSC_KEY_PASSWORD:-}" ]; then
            fail "MAC_CSC_KEY_PASSWORD" "not set — the .p12 export password is required to import it"
          else
            ok "MAC_CSC_KEY_PASSWORD" "set (${#MAC_CSC_KEY_PASSWORD} characters)"
          fi

          # App Store Connect API key: the .p8 is a PEM private key.
          if [ -z "${APPLE_API_KEY_P8_BASE64:-}" ]; then
            fail "APPLE_API_KEY_P8_BASE64" "not set — notarization is skipped and mac assets ship unstapled"
          else
            if printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode 2>/dev/null | grep -q "PRIVATE KEY"; then
              ok "APPLE_API_KEY_P8_BASE64" "decodes to a PEM private key"
            else
              fail "APPLE_API_KEY_P8_BASE64" "does not decode to a PEM key — use the AuthKey_XXXX.p8 downloaded once from App Store Connect"
            fi
          fi

          if [ -z "${APPLE_API_KEY_ID:-}" ]; then
            fail "APPLE_API_KEY_ID" "not set — the Key ID shown next to the API key"
          elif printf '%s' "$APPLE_API_KEY_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            ok "APPLE_API_KEY_ID" "10-character key id"
          else
            fail "APPLE_API_KEY_ID" "not 10 uppercase alphanumerics — that is the Key ID column, not the Issuer"
          fi

          if [ -z "${APPLE_API_ISSUER:-}" ]; then
            fail "APPLE_API_ISSUER" "not set — the Issuer ID above the key list (a UUID)"
          elif printf '%s' "$APPLE_API_ISSUER" | grep -Eqi '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            ok "APPLE_API_ISSUER" "UUID"
          else
            fail "APPLE_API_ISSUER" "not a UUID — the Issuer ID is a UUID, the Key ID is not"
          fi

          # Team ID: a repository variable, not a secret (it is public in the signature anyway). It is baked
          # into the bundle at package time, so it must exist before the release build, not after.
          if [ -z "${MAC_TEAM_ID:-}" ]; then
            fail "vars.PURESCIENCE_MAC_TEAM_ID" "not set — add it under Settings → Secrets and variables → Actions → Variables"
          elif printf '%s' "$MAC_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            ok "vars.PURESCIENCE_MAC_TEAM_ID" "10-character team id"
          else
            fail "vars.PURESCIENCE_MAC_TEAM_ID" "not 10 uppercase alphanumerics — it is in the certificate name: Developer ID Application: NAME (XXXXXXXXXX)"
          fi

          echo
          if [ "$problems" -ne 0 ]; then
            echo "::error::${problems} signing input(s) missing or malformed — see the table above."
            exit 1
          fi
          echo "All six inputs are present and shaped correctly. The next release build will sign, notarize and staple."
