name: Stage runtime bundle

# Build the per-platform offline default-environment bundle and publish it. Consumers fetch packs
# from the `runtime-cdn` ORPHAN BRANCH of this repository via raw.githubusercontent.com — the
# consumer default base is src/main/notebook/runtime-paths.ts DEFAULT_RUNTIME_CDN_BASE
# (…/runtime-cdn/purescience). The branch is force-rewritten to a SINGLE-ROOT snapshot holding only
# the requested version, so it never grows; the same snapshot doubles as the zero-infra fallback
# until a real object-storage CDN is provisioned (re-add an S3 upload step behind secrets then).
#
# Published layout (per conda subdir): `<language>-<version>.tar.zst` pack archives (packId) and
# manifest.json — the files the local bundle adapter looks up under resources/default-envs. Run by
# hand whenever DEFAULT_ENV_VERSION or the default env specs change; the packaged app and this
# bundle are keyed by the same version (runtime-paths.ts DEFAULT_ENV_VERSION). Each platform solves
# NATIVELY on its own runner so there is no cross-arch solve — each installer ships pack archives
# for exactly its own conda subdir.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Runtime bundle version to publish
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-bundle-publisher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage ${{ matrix.subdir }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # subdir = conda platform to SOLVE for; runner_subdir = the runner's native arch, whose
        # micromamba we run. They differ only for osx-64: Intel macOS runners (macos-13) are scarce, so
        # osx-64 is cross-solved on Apple-silicon (macos-14) — the dry-run solve never runs foreign-arch
        # binaries, so this is safe (see stage-default-envs.mjs).
        include:
          - subdir: osx-arm64
            os: macos-14
            runner_subdir: osx-arm64
          - subdir: osx-64
            os: macos-14
            runner_subdir: osx-arm64
          - subdir: linux-64
            os: ubuntu-latest
            runner_subdir: linux-64
          - subdir: win-64
            os: windows-latest
            runner_subdir: win-64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # The staging script packs each env into a .tar.zst via scripts/pack-archive.mjs, which imports
      # @bokuweb/zstd-wasm + tar — so node_modules must be present. --ignore-scripts skips the heavy,
      # postinstall-only platform binaries we never run here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # micromamba comes from the pinned official GitHub release asset (see fetch-micromamba.mjs), not
      # our CDN, so staging never depends on a chicken-and-egg CDN state. Fetch the RUNNER's native
      # micromamba (runner_subdir) to execute; the target platform to solve for is passed separately.
      - name: Fetch micromamba
        shell: bash
        run: |
          bin="$RUNNER_TEMP/micromamba"
          [ "${{ matrix.runner_subdir }}" = "win-64" ] && bin="$bin.exe"
          # Pass the pinned version explicitly so the intent is visible in CI. Read it from the single
          # source of truth (scripts/micromamba-versions.json) to avoid drifting from the digests the
          # script verifies against.
          export MICROMAMBA_VERSION=$(node -p "require('./scripts/micromamba-versions.json').version")
          echo "using pinned micromamba $MICROMAMBA_VERSION"
          node scripts/fetch-micromamba.mjs "${{ matrix.runner_subdir }}" "$bin"
          echo "MICROMAMBA_BIN=$bin" >> "$GITHUB_ENV"

      - name: Stage default envs
        env:
          OS_STAGE_PLATFORM: ${{ matrix.subdir }}
        run: npm run stage-default-envs

      # Fail loudly if staging produced nothing, rather than uploading an empty/partial bundle: require
      # the manifest and at least one pack archive. The per-pack completeness gate already ran inside
      # the script.
      - name: Verify bundle is non-empty
        shell: bash
        run: |
          shopt -s nullglob
          test -f resources/default-envs/manifest.json
          archives=(resources/default-envs/*.tar.zst)
          echo "staged ${#archives[@]} pack archives for ${{ matrix.subdir }}"
          [ "${#archives[@]}" -gt 0 ]

      # Read DEFAULT_ENV_VERSION straight from its source of truth so the CDN path always matches the
      # version segment the app/build keys off (runtime-paths.ts DEFAULT_ENV_VERSION).
      - name: Resolve bundle version
        id: ver
        shell: bash
        run: |
          requested='${{ inputs.version }}'
          current=$(node -e "const s=require('fs').readFileSync('src/main/notebook/runtime-paths.ts','utf8');process.stdout.write(String(s.match(/DEFAULT_ENV_VERSION\s*=\s*(\d+)/)[1]))")
          if ! [[ "$requested" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::version must be a positive integer"
            exit 1
          fi
          if [ "$requested" != "$current" ]; then
            echo "::error::requested version $requested does not match DEFAULT_ENV_VERSION $current on this ref"
            exit 1
          fi
          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "bundle version = $requested"

      # Ship each platform's bundle as a CI artifact; the collect/publish jobs below snapshot them
      # onto the runtime-cdn branch (GitHub-native, no external storage required).
      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runtime-bundle-${{ matrix.subdir }}
          path: resources/default-envs/
          if-no-files-found: error
          retention-days: 1

  collect:
    name: Collect ${{ matrix.subdir }}
    needs: stage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subdir: [osx-arm64, osx-64, linux-64, win-64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve bundle version
        id: ver
        shell: bash
        run: |
          current=$(node -e "const s=require('fs').readFileSync('src/main/notebook/runtime-paths.ts','utf8');process.stdout.write(String(s.match(/DEFAULT_ENV_VERSION\s*=\s*(\d+)/)[1]))")
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Download bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: runtime-bundle-${{ matrix.subdir }}
          path: /tmp/cdn/purescience/runtime-bundle/${{ steps.ver.outputs.version }}/${{ matrix.subdir }}

      - name: Upload collected tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: runtime-tree
          path: /tmp/cdn/
          if-no-files-found: error
          retention-days: 1

  publish-github:
    name: Publish runtime-cdn branch snapshot
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download collected tree
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: runtime-tree
          path: /tmp/cdn/

      - name: Resolve bundle version
        id: ver
        shell: bash
        run: |
          current=$(node -e "const s=require('fs').readFileSync('src/main/notebook/runtime-paths.ts','utf8');process.stdout.write(String(s.match(/DEFAULT_ENV_VERSION\s*=\s*(\d+)/)[1]))")
          echo "version=$current" >> "$GITHUB_OUTPUT"

      # Force-rewrite the orphan branch to a single-root snapshot containing ONLY this version, so the
      # branch never accumulates history/bloat. raw.githubusercontent.com serves the manifest + packs.
      - name: Snapshot tree onto runtime-cdn branch
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          test -f "/tmp/cdn/purescience/runtime-bundle/$VERSION/osx-arm64/manifest.json"
          git checkout --orphan mirror-snapshot
          git rm -rf --quiet . >/dev/null 2>&1 || true
          mkdir -p "purescience/runtime-bundle/$VERSION"
          cp -R "/tmp/cdn/purescience/runtime-bundle/$VERSION/." "purescience/runtime-bundle/$VERSION/"
          git add -A
          git -c user.name='PureScience Runtime Mirror' \
              -c user.email='actions@users.noreply.github.com' \
              commit -q -m "runtime-bundle v$VERSION (GitHub mirror snapshot)"
          git push -f origin "HEAD:runtime-cdn"
          echo "published runtime-bundle v$VERSION to runtime-cdn branch"

      - name: Verify snapshot URLs
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          for subdir in osx-arm64 osx-64 linux-64 win-64; do
            url="https://raw.githubusercontent.com/naiyixi/PureScience/runtime-cdn/purescience/runtime-bundle/$VERSION/$subdir/manifest.json"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            echo "$subdir manifest -> HTTP $code"
            test "$code" = "200"
          done
