<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="PureScience Remote" />
    <meta name="apple-mobile-web-app-title" content="PureScience Remote" />
    <title>PureScience Remote</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; media-src 'self' https: blob:; frame-src 'self'; connect-src 'self' ws: wss:"
    />
    <style>
      :root {
        --connection-background: #ffffff;
        --connection-foreground: #171717;
        --connection-muted: #737373;
        --connection-spinner-track: #d4d4d4;
      }
      .dark {
        --connection-background: #171717;
        --connection-foreground: #fafafa;
        --connection-muted: #a3a3a3;
        --connection-spinner-track: #525252;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --connection-background: #171717;
          --connection-foreground: #fafafa;
          --connection-muted: #a3a3a3;
          --connection-spinner-track: #525252;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .purescience-connection-panel {
        display: grid;
        width: fit-content;
        max-width: 420px;
        justify-items: start;
        text-align: left;
      }
      .purescience-connection-brand {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }
      .purescience-connection-logo {
        display: block;
        width: 40px;
        height: 39px;
        flex: none;
        color: var(--connection-foreground);
      }
      .purescience-connection-logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .purescience-connection-name {
        font-family: Georgia, serif;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      .purescience-connection-progress {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 9px;
        margin-top: 14px;
        color: var(--connection-muted);
      }
      .purescience-connection-spinner {
        width: 16px;
        height: 16px;
        flex: none;
        border: 2px solid var(--connection-spinner-track);
        border-top-color: currentColor;
        border-radius: 999px;
        animation: purescience-connection-spin 0.8s linear infinite;
      }
      .connection-failed .purescience-connection-spinner {
        display: none;
      }
      @keyframes purescience-connection-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .purescience-connection-spinner {
          animation-duration: 1.8s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="purescience-connection-state"
        role="status"
        aria-live="polite"
        style="
          box-sizing: border-box;
          display: grid;
          min-height: 100dvh;
          place-items: center;
          padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
          background: var(--connection-background);
          color: var(--connection-foreground);
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
        "
      >
        <div class="purescience-connection-panel">
          <div class="purescience-connection-brand">
            <span
              id="purescience-connection-logo"
              class="purescience-connection-logo"
              aria-hidden="true"
            ></span>
            <div class="purescience-connection-name">PureScience</div>
          </div>
          <div class="purescience-connection-progress">
            <span class="purescience-connection-spinner" aria-hidden="true"></span>
            <p
              id="purescience-connection-message"
              style="margin: 0; color: var(--connection-muted); font-size: 14px; line-height: 1.6"
            >
              Connecting to remote computer…
            </p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/bootstrap.ts"></script>
  </body>
</html>
